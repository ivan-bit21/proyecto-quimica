<html lang="es">
<head>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(145deg, #0f1724 0%, #1a1a2e 100%);
            margin: 0;
            padding: 20px;
            color: #eee;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(15, 25, 35, 0.7);
            backdrop-filter: blur(3px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            font-size: 2.3rem;
            margin: 0 0 0.5rem;
            background: linear-gradient(135deg, #FFD966, #6AB0DE, #FF8C69);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.8;
            font-style: italic;
        }

        /* Buscador */
        .search-area {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-area input {
            width: 320px;
            padding: 14px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 60px;
            background: #f0f4fa;
            color: #1e2a3a;
            font-weight: 500;
            outline: none;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .search-area input:focus {
            transform: scale(1.01);
            background: #fff;
            box-shadow: 0 0 0 3px #6AB0DE;
        }

        .search-area button {
            background: #2c5f8a;
            border: none;
            padding: 0 28px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-area button:hover {
            background: #1e4a6e;
            transform: translateY(-2px);
        }

        /* Panel de información */
        .info-panel {
            background: #0b1620dd;
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.2rem 2rem;
            margin-bottom: 2rem;
            border-left: 8px solid #FFD966;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .info-panel h2 {
            margin: 0 0 0.5rem 0;
            color: #FFD966;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .info-card {
            background: #1e2a36;
            border-radius: 1rem;
            padding: 8px 14px;
        }

        .info-label {
            font-weight: bold;
            color: #8ab3cf;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 500;
            word-break: break-word;
        }

        /* Tabla periódica (grid) */
        .periodic-table {
            overflow-x: auto;
            margin-top: 10px;
        }

        .pt-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(70px, 80px));
            gap: 5px;
            justify-content: center;
            background: transparent;
            padding-bottom: 20px;
        }

        .element-card {
            background: #1f2c38cc;
            backdrop-filter: blur(4px);
            border-radius: 10px;
            padding: 6px 3px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid #3e5568;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .element-card:hover {
            transform: scale(1.03);
            background: #2c4050;
            border-color: #FFD966;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .element-symbol {
            font-size: 1.3rem;
            font-weight: bold;
            color: #FFE5B4;
        }

        .element-number {
            font-size: 0.65rem;
            color: #9bb7d0;
        }

        .element-name {
            font-size: 0.6rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #cbdbe6;
        }

        .element-mass {
            font-size: 0.55rem;
            color: #a8c0d8;
        }

        /* Colores por categoría (borde superior) */
        .nonmetal { border-top: 3px solid #6fbf73; }
        .noble-gas { border-top: 3px solid #b0d9ff; }
        .alkali-metal { border-top: 3px solid #ffa270; }
        .alkaline-earth { border-top: 3px solid #f7d44a; }
        .transition { border-top: 3px solid #e8a87c; }
        .lanthanide { border-top: 3px solid #b39cd0; }
        .actinide { border-top: 3px solid #ff8c94; }
        .post-transition { border-top: 3px solid #80b3b3; }
        .metalloid { border-top: 3px solid #b3cc57; }
        .halogen { border-top: 3px solid #ff9f4a; }

        @media (max-width: 1100px) {
            .pt-grid {
                grid-template-columns: repeat(18, minmax(60px, 68px));
            }
            .element-symbol { font-size: 1rem; }
            .element-name { font-size: 0.55rem; white-space: normal; word-break: break-word; }
        }
        @media (max-width: 800px) {
            .pt-grid {
                grid-template-columns: repeat(18, minmax(48px, 55px));
            }
            .element-symbol { font-size: 0.85rem; }
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            opacity: 0.6;
        }
    </style>
</head>

        {z:114, sym:"Fl", nom:"Flerovio", mass:289.0, group:14, period:7, cat:"Metal post-transición", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²"},

    // Función para mostrar la información detallada del elemento
    function mostrarInfo(elem) {
        const infoGrid = document.getElementById('infoGrid');
        const titleSpan = document.getElementById('infoTitle');
        titleSpan.innerHTML = `⚛️ ${elem.sym} - ${elem.nom} (Z=${elem.z})`;
        
        infoGrid.innerHTML = `
            <div class="info-card"><div class="info-label">Símbolo</div><div class="info-value">${elem.sym}</div></div>
            <div class="info-card"><div class="info-label">Nombre</div><div class="info-value">${elem.nom}</div></div>
            <div class="info-card"><div class="info-label">Número Atómico</div><div class="info-value">${elem.z}</div></div>
            <div class="info-card"><div class="info-label">Balanza (Config. electrónica)</div><div class="info-value">${elem.config}</div></div>
            <div class="info-card"><div class="info-label">Masa Atómica (u)</div><div class="info-value">${elem.mass}</div></div>
            <div class="info-card"><div class="info-label">Grupo / Periodo</div><div class="info-value">${elem.group} / ${elem.period}</div></div>
            <div class="info-card"><div class="info-label">Categoría</div><div class="info-value">${elem.cat}</div></div>
        `;
    }

    // Búsqueda por nombre, símbolo o número
    function buscarElemento() {
        let query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (query === "") return;
        let encontrado = elementosData.find(el => 
            el.nom.toLowerCase() === query || 
            el.sym.toLowerCase() === query || 
            el.z.toString() === query ||
            el.nom.toLowerCase().includes(query) ||
            el.sym.toLowerCase().includes(query)
        );
        if (encontrado) {
            mostrarInfo(encontrado);
            document.getElementById('infoPanel').scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
            alert(`❌ Elemento "${query}" no encontrado. Revisa el nombre o símbolo.`);
        }
    }

    // Renderizar la tabla periódica (grid por periodo y grupo)
    function renderTabla() {
        // Crear matriz de 10 filas (periodos 1-8) y 19 columnas (grupos 1-18)
        let matrix = Array(10).fill().map(() => Array(19).fill(null));
        for (let el of elementosData) {
            let p = el.period;
            let g = el.group;
            if (p >= 1 && p <= 8 && g >= 1 && g <= 18) {
                matrix[p][g] = el;
            }
        }
        const grid = document.getElementById('periodicGrid');
        grid.innerHTML = '';
        // Mostrar periodos del 1 al 8
        for (let p = 1; p <= 8; p++) {
            for (let g = 1; g <= 18; g++) {
                let elem = matrix[p][g];
                if (elem) {
                    let card = document.createElement('div');
                    // Asignar clase CSS según categoría para el borde
                    let catClass = "";
                    if (elem.cat.includes("alcalino") && !elem.cat.includes("alcalinotérreo")) catClass = "alkali-metal";
                    else if (elem.cat.includes("alcalinotérreo")) catClass = "alkaline-earth";
                    else if (elem.cat.includes("transición")) catClass = "transition";
                    else if (elem.cat.includes("Gas noble")) catClass = "noble-gas";
                    else if (elem.cat.includes("Halógeno")) catClass = "halogen";
                    else if (elem.cat.includes("Metaloide")) catClass = "metalloid";
                    else if (elem.cat.includes("No metal")) catClass = "nonmetal";
                    else if (elem.cat.includes("Lantánido") || elem.cat.includes("Actínido")) catClass = elem.cat.includes("Lantánido") ? "lanthanide" : "actinide";
                    else catClass = "post-transition";
                    card.className = `element-card ${catClass}`;
                    card.innerHTML = `
                        <div class="element-number">${elem.z}</div>
                        <div class="element-symbol">${elem.sym}</div>
                        <div class="element-name">${elem.nom}</div>
                        <div class="element-mass">${elem.mass}</div>
                    `;
                    card.addEventListener('click', () => mostrarInfo(elem));
                    grid.appendChild(card);
                } else {
                    let emptyDiv = document.createElement('div');
                    emptyDiv.style.background = "transparent";
                    emptyDiv.style.border = "none";
                    grid.appendChild(emptyDiv);
                }
            }
        }
    }

    // Inicializar eventos y renderizar
    document.getElementById('searchBtn').addEventListener('click', buscarElemento);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') buscarElemento();
    });
    renderTabla();
    // Mostrar información del primer elemento por defecto (Hidrógeno)
    mostrarInfo(elementosData[0]);
</script>
</body>
</html>
